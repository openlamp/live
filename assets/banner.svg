<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="OpenLamp Ableton Pack — 20 ready-made MIDI clips driving WLED lamps from an Ableton Live timeline">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#141a35"/>
      <stop offset="1" stop-color="#1c1030"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb454"/>
      <stop offset="0.5" stop-color="#ff6a4d"/>
      <stop offset="1" stop-color="#e64c9e"/>
    </linearGradient>
    <linearGradient id="accentV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb454"/>
      <stop offset="1" stop-color="#e64c9e"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="360" fill="url(#bg)"/>

  <!-- Motif: pack — a crate of ready-made clips -->
  <g transform="translate(160,180)">
    <rect x="-84" y="-66" width="168" height="132" rx="14" fill="#0e1430" stroke="url(#accent)" stroke-width="2.5"/>
    <path d="M-84 -30 H84" stroke="url(#accent)" stroke-width="2.5" opacity="0.6"/>
    <g fill="url(#accent)" opacity="0.92">
      <rect x="-64" y="-12" width="40" height="22" rx="5"/>
      <rect x="-14" y="-12" width="40" height="22" rx="5"/>
      <rect x="36"  y="-12" width="28" height="22" rx="5"/>
      <rect x="-64" y="22" width="28" height="22" rx="5"/>
      <rect x="-26" y="22" width="40" height="22" rx="5"/>
    </g>
    <rect x="24" y="22" width="40" height="22" rx="5" fill="url(#accent)" filter="url(#glow)"/>
  </g>

  <!-- Title -->
  <g transform="translate(300,116)">
    <text x="4" y="-34" font-family="Menlo, Consolas, monospace" font-size="17" font-weight="700" fill="url(#accent)" letter-spacing="5">OPENLAMP · PACK</text>
    <text x="0" y="44" font-family="-apple-system, Segoe UI, sans-serif" font-size="76" font-weight="700" fill="#ffffff" letter-spacing="-1">Ableton Pack</text>
    <rect x="4" y="62" width="474" height="5" rx="2.5" fill="url(#accent)"/>
    <text x="4" y="108" font-family="-apple-system, Segoe UI, sans-serif" font-size="23" fill="#aab4d8">20 ready-made MIDI clips driving WLED lamps from an Ableton Live timeline.</text>
    <text x="4" y="146" font-family="Menlo, Consolas, monospace" font-size="17" fill="#7f8bb5">openlamp-pack-ableton  ·  colours · sweeps · beat pulse  ·  generated from the spec</text>
  </g>

  <!-- Lamp line (shared family strip) -->
  <g transform="translate(300,286)" opacity="0.9">
    <rect x="0" y="0" width="910" height="46" rx="8" fill="#0e1430" stroke="#2a3358" stroke-width="1.5"/>
    <path d="M 26 23 H 910" stroke="#2a3358" stroke-width="2"/>
    <path d="M 26 23 H 150" stroke="url(#accent)" stroke-width="2.5"/>
    <g><circle cx="26" cy="23" r="8" fill="none" stroke="#3a4472" stroke-width="2"/><circle cx="88" cy="23" r="8" fill="none" stroke="#3a4472" stroke-width="2"/><circle cx="150" cy="23" r="11" fill="url(#accent)" filter="url(#glow)"/><circle cx="212" cy="23" r="8" fill="none" stroke="#3a4472" stroke-width="2"/><circle cx="274" cy="23" r="8" fill="none" stroke="#3a4472" stroke-width="2"/><circle cx="336" cy="23" r="8" fill="none" stroke="#3a4472" stroke-width="2"/><circle cx="398" cy="23" r="8" fill="none" stroke="#3a4472" stroke-width="2"/><circle cx="460" cy="23" r="8" fill="none" stroke="#3a4472" stroke-width="2"/></g>
  </g>
</svg>
